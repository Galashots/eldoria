name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - name: Surface crop lab runtime assets
        if: github.head_ref == 'codex/crop-asset-lab'
        run: |
          for file in assets/iso/crop-*.png; do
            name="$(basename "$file" .png)"
            echo "CROP_RUNTIME_${name}_BASE64_BEGIN"
            base64 "$file"
            echo "CROP_RUNTIME_${name}_BASE64_END"
          done
      - name: Upload playtest evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playtest-evidence
          path: artifacts/*.png
          if-no-files-found: ignore
