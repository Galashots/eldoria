name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: tools/pipeline/requirements.lock
      - run: pip install -r tools/pipeline/requirements.lock
      - run: npm ci
      - run: npm test
      - run: npm run assets:verify
      - run: npm run ranger-proof:candidate
      - name: Validate hero sprite contracts
        run: |
          python tools/pipeline/validate_sprites.py --dir assets --profile adventurer --require-walks
          python tools/pipeline/validate_sprites.py --dir assets --profile mage --require-walks
      - name: Fail if the worktree changed
        run: git diff --exit-code
      - name: Upload playtest evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playtest-evidence
          path: |
            artifacts/*.png
            artifacts/**/*.png
            artifacts/**/*.json
          if-no-files-found: ignore
