name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - name: Surface crop lab evidence
        if: github.head_ref == 'codex/crop-asset-lab'
        run: |
          echo CROP_LAB_DENSE_BASE64_BEGIN
          base64 artifacts/crop-asset-lab-dense-ipad.png
          echo CROP_LAB_DENSE_BASE64_END
      - name: Upload playtest evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playtest-evidence
          path: artifacts/*.png
          if-no-files-found: ignore
